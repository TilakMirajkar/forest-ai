services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: forest
      POSTGRES_PASSWORD: forest
      POSTGRES_DB: forest_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://forest:forest@db:5432/forest_ai
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata: